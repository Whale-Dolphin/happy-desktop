<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; background: transparent; }
body { font-family: var(--happy-host-font, system-ui, sans-serif); color: var(--happy-host-text, #eee); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.lane { font-size: 10px; font-weight: 600; letter-spacing: 0.09em; fill: currentColor; opacity: 0.5; }
.rule { stroke: currentColor; stroke-opacity: 0.12; }
.edge { fill: none; stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.4; }
.edge-label { font-size: 11px; fill: currentColor; opacity: 0.62; }
.note { font-size: 11.5px; fill: currentColor; opacity: 0.72; }
.note tspan.lead { font-weight: 650; opacity: 1; }
.title { font-size: 12.5px; font-weight: 650; fill: #2a211c; }
.sub { font-size: 10px; fill: #2a211c; fill-opacity: 0.7; }
.shine { fill: none; stroke: #fff; stroke-opacity: 0.55; }
</style>
</head>
<body>
<svg viewBox="0 0 600 344" role="img" aria-label="How Happy voice works: the desktop, GPT-Live, and the Happy daemon">
<defs>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fad8bd"/><stop offset="1" stop-color="#efb48a"/></linearGradient>
  <linearGradient id="live" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e1d6fb"/><stop offset="1" stop-color="#bba8ee"/></linearGradient>
  <linearGradient id="daemon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdeedb"/><stop offset="1" stop-color="#97d3b2"/></linearGradient>
  <filter id="clay" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000" flood-opacity="0.32"/></filter>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L7.4,4 L0,7.2 Z" fill="currentColor" fill-opacity="0.62"/></marker>
</defs>

<!-- Lanes -->
<text class="lane" x="0" y="11">YOUR DESKTOP</text>
<line class="rule" x1="0" y1="86" x2="600" y2="86"/>
<text class="lane" x="0" y="104">OPENAI</text>
<line class="rule" x1="0" y1="178" x2="600" y2="178"/>
<text class="lane" x="0" y="196">HAPPY DAEMON</text>

<!-- Edges, under the nodes -->
<path class="edge" d="M64,66 V114" marker-end="url(#arrow)"/>
<text class="edge-label" x="70" y="97">your voice</text>
<path class="edge" d="M214,114 V66" marker-end="url(#arrow)"/>
<text class="edge-label" x="220" y="97">its reply</text>
<path class="edge" d="M472,44 H452" marker-end="url(#arrow)"/>
<path class="edge" d="M120,162 V206" marker-end="url(#arrow)"/>
<text class="edge-label" x="114" y="174" text-anchor="end">your request</text>
<path class="edge" d="M172,206 V162" marker-end="url(#arrow)"/>
<text class="edge-label" x="178" y="174">text to speak</text>
<path class="edge" d="M200,228 H238" marker-end="url(#arrow)"/>
<path class="edge" d="M390,228 H428" marker-end="url(#arrow)"/>
<path class="edge" d="M452,206 C452,188 192,188 192,206" marker-end="url(#arrow)"/>
<text class="edge-label" x="322" y="186" text-anchor="middle">outcome</text>
<path class="edge" d="M536,206 V66" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="edge-label" x="530" y="128" text-anchor="end">action</text>
<text class="edge-label" x="530" y="142" text-anchor="end">and result</text>
<path class="edge" d="M515,250 V292" marker-end="url(#arrow)"/>
<text class="edge-label" x="521" y="275">reads</text>
<path class="edge" d="M110,292 V250" marker-end="url(#arrow)"/>
<text class="edge-label" x="116" y="275">when it changes</text>

<!-- Your desktop -->
<g filter="url(#clay)">
  <rect x="0" y="22" width="128" height="44" rx="12" fill="url(#desk)"/>
  <rect x="150" y="22" width="128" height="44" rx="12" fill="url(#desk)"/>
  <rect x="322" y="22" width="130" height="44" rx="12" fill="url(#desk)"/>
  <rect x="472" y="22" width="128" height="44" rx="12" fill="url(#desk)"/>
</g>
<rect class="shine" x="1" y="23" width="126" height="42" rx="11"/>
<rect class="shine" x="151" y="23" width="126" height="42" rx="11"/>
<rect class="shine" x="323" y="23" width="128" height="42" rx="11"/>
<rect class="shine" x="473" y="23" width="126" height="42" rx="11"/>
<text class="title" x="14" y="41">Microphone</text>
<text class="sub" x="14" y="56">echo-cancelled</text>
<text class="title" x="164" y="41">Speaker</text>
<text class="sub" x="164" y="56">plays the reply</text>
<text class="title" x="336" y="41">Conversation</text>
<text class="sub" x="336" y="56">opened, words staged</text>
<text class="title" x="486" y="41">Desktop actions</text>
<text class="sub" x="486" y="56">one at a time, verified</text>

<!-- OpenAI -->
<rect x="20" y="114" width="250" height="48" rx="14" fill="url(#live)" filter="url(#clay)"/>
<rect class="shine" x="21" y="115" width="248" height="46" rx="13"/>
<text class="title" x="36" y="135">GPT-Live</text>
<text class="sub" x="36" y="151">speech in, speech out, over WebRTC</text>
<text class="note" x="296" y="128"><tspan class="lead">Barge-in:</tspan> talk over it and it</text>
<text class="note" x="296" y="143">stops speaking to listen. Work</text>
<text class="note" x="296" y="158">already started carries on.</text>

<!-- Happy daemon -->
<g filter="url(#clay)">
  <rect x="20" y="206" width="180" height="44" rx="12" fill="url(#daemon)"/>
  <rect x="240" y="206" width="150" height="44" rx="12" fill="url(#daemon)"/>
  <rect x="430" y="206" width="170" height="44" rx="12" fill="url(#daemon)"/>
  <rect x="20" y="292" width="180" height="44" rx="12" fill="url(#daemon)"/>
  <rect x="430" y="292" width="170" height="44" rx="12" fill="url(#daemon)"/>
</g>
<rect class="shine" x="21" y="207" width="178" height="42" rx="11"/>
<rect class="shine" x="241" y="207" width="148" height="42" rx="11"/>
<rect class="shine" x="431" y="207" width="168" height="42" rx="11"/>
<rect class="shine" x="21" y="293" width="178" height="42" rx="11"/>
<rect class="shine" x="431" y="293" width="168" height="42" rx="11"/>
<text class="title" x="34" y="225">Live module</text>
<text class="sub" x="34" y="240">starts the call, relays text</text>
<text class="title" x="254" y="225">Request queue</text>
<text class="sub" x="254" y="240">one at a time, per person</text>
<text class="title" x="444" y="225">Voice agent</text>
<text class="sub" x="444" y="240">text only, Sol by default</text>
<text class="title" x="34" y="311">Sidebar outline</text>
<text class="sub" x="34" y="326">names, to GPT-Live and Voice</text>
<text class="title" x="444" y="311">Read tools</text>
<text class="sub" x="444" y="326">sidebar and chats, on demand</text>
<text class="note" x="220" y="304"><tspan class="lead">Routing:</tspan> Voice names the chat,</text>
<text class="note" x="220" y="319">the window opens it and stages</text>
<text class="note" x="220" y="334">your words. You press Send.</text>
</svg>
</body>
</html>
